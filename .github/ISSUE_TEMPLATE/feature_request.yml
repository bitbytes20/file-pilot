name: Feature Request
description: Suggest an improvement for FilePilot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to Solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety Considerations
      description: Any impact on delete/move behavior?
